version: "3.9"

services:
  pb:
    build:
      context: ./pocketbase
    container_name: egm-pb
    restart: unless-stopped
    ports:
      # Published for SSH-tunnel admin access only (`ssh -L 8090:127.0.0.1:8090
      # deploy@$GCP_SSH_HOST`, then http://127.0.0.1:8090/_/ locally) — the
      # GCP firewall (scripts/provision-gcp-vm.sh) only opens port 80, so this
      # is NOT reachable from the public internet regardless of this mapping.
      # The `proxy` service below also exposes read/API access publicly under
      # /pb/* — see Caddyfile's comment for why the ADMIN UI specifically
      # (/pb/_/) doesn't fully work through that path and still needs this
      # tunnel.
      - "${PB_PORT:-8090}:8090"
    volumes:
      # Bind mount (not a named Docker volume) — on purpose, so the nightly
      # backup script (scripts/backup-to-drive.sh, run via host crontab) can
      # read pb_data directly without needing `docker exec` into the
      # container. Also makes "where's the data" obvious on the VM.
      - ${PB_DATA_DIR:-/data/englishmania/pb_data}:/pb/pb_data
    environment:
      - SUPERUSER_EMAIL=${SUPERUSER_EMAIL}
      - SUPERUSER_PASS=${SUPERUSER_PASS}

  web:
    build:
      context: ./web
      args:
        # PUBLIC_* must be a build arg, not a runtime env var — see the note
        # in web/Dockerfile. Everything else below is fine as runtime env
        # since it's read via process.env in server-only code.
        PUBLIC_TURNSTILE_SITE_KEY: ${PUBLIC_TURNSTILE_SITE_KEY}
    container_name: egm-web
    restart: unless-stopped
    depends_on:
      - pb
    # No published host port — the `proxy` service (Caddy, below) is the
    # only container that binds to the host now, and reaches this one over
    # the compose network by service name (`web:4321`). For local debugging
    # without going through the proxy, add a `docker-compose.override.yml`
    # with your own `ports: ["3000:4321"]` on this service rather than
    # editing this file — override files aren't committed, so they can't
    # accidentally reintroduce the port-3000-vs-Cloudflare mismatch this
    # setup was built to avoid (see the WEB_PORT history in git log if
    # curious).
    expose:
      - "4321"
    environment:
      - POCKETBASE_URL=http://pb:8090
      - PUBLIC_POCKETBASE_URL=${PUBLIC_POCKETBASE_URL:-https://englishmania.co.th/pb}
      - GOOGLE_SHEETS_ID=${GOOGLE_SHEETS_ID}
      - GOOGLE_SERVICE_ACCOUNT_JSON=${GOOGLE_SERVICE_ACCOUNT_JSON}
      - GMAIL_SENDER=${GMAIL_SENDER}
      - TURNSTILE_SECRET_KEY=${TURNSTILE_SECRET_KEY}
      # Service-account auth for api/contact.ts + api/reviews.ts, now that
      # contact_submissions/reviews.createRule are superuser-only (migration
      # 5, COURSE_PAGES_PRD.md CRITICAL #1) — same account `pb`'s own
      # SUPERUSER_EMAIL/PASS above already provisions, just also given to the
      # web container so the API routes can authenticate before writing.
      - SUPERUSER_EMAIL=${SUPERUSER_EMAIL}
      - SUPERUSER_PASS=${SUPERUSER_PASS}

  # Reverse proxy — the ONLY container that binds to the host now (port 80,
  # matching scripts/provision-gcp-vm.sh's firewall rule and Cloudflare's
  # Flexible-SSL origin port). Routes /pb/* to PocketBase (path stripped
  # first — see Caddyfile) and everything else to the Astro app. Added
  # 2026-08-20 so PUBLIC_POCKETBASE_URL's documented `.../pb` path (README's
  # secrets table, this file's `web.environment` above) actually resolves to
  # something — before this, nothing routed that path anywhere.
  proxy:
    image: caddy:2-alpine
    container_name: egm-proxy
    restart: unless-stopped
    depends_on:
      - pb
      - web
    ports:
      - "${WEB_PORT:-80}:80"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Caddy's own state (its config's `storage` path) — harmless to lose on
      # a rebuild since `auto_https off` means it never issues certs, but a
      # named volume keeps `docker compose up -d --build` from re-pulling a
      # cold image layer for it every deploy.
      - caddy_data:/data

volumes:
  caddy_data:
